<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <span class="brand-mark">CG</span>

      <div>
        <h1>Control-Gastos</h1>
        <p>Gestión financiera personal</p>
      </div>
    </div>

    <div class="auth-header">
      <span class="eyebrow">NUEVA CUENTA</span>

      <h2>Crear cuenta</h2>

      <p>
        Registra tus datos para comenzar a controlar
        tus gastos.
      </p>
    </div>

    @if (errorMessage) {
      <div class="alert error">
        {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="alert success">
        {{ successMessage }}
      </div>
    }

    <form (ngSubmit)="register()">

      <div class="field">

        <label for="name">
          Nombre
        </label>

        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="name"
          placeholder="Tu nombre"
          autocomplete="name"
        />

      </div>

      <div class="field">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        />

      </div>

      <div class="field">

        <label for="password">
          Contraseña
        </label>

        <div class="password-field">

          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
          />

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
          >
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>

        </div>

      </div>

      <div class="field">

        <label for="confirmPassword">
          Confirmar contraseña
        </label>

        <div class="password-field">

          <input
            id="confirmPassword"
            name="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
          />

          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPassword()"
          >
            {{ showConfirmPassword ? 'Ocultar' : 'Mostrar' }}
          </button>

        </div>

      </div>

      <button
        class="submit-button"
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>

    </form>

    <div class="auth-footer">

      <span>¿Ya tienes una cuenta?</span>

      <a routerLink="/login">
        Iniciar sesión
      </a>

    </div>

  </div>

</div>
